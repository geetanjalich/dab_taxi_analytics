# This is a Declarative Automation Bundle definition for taxi_analytics_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: taxi_analytics_bundle
  uuid: 218de4ef-2337-4849-bf55-f55710144d2b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8649e417-5538.cloud.databricks.com
    variables:
      catalog: taxi_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-8649e417-5538.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/geetanjalichipurapalli@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/geetanjalichipurapalli@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_taxi_analytics
      schema: rnd
    permissions:
      - user_name: geetanjalichipurapalli@gmail.com
        level: CAN_MANAGE
